{% extends 'base.html' %}

{% block body %}

<div class="container my-4">

    <h1>Update Todo</h1>

    <form action="/update/{{todo.sno}}" method="POST">

        <div class="mb-3">
            <label class="form-label">Todo Title</label>

            <input type="text"
                   class="form-control"
                   name="title"
                   value="{{todo.title}}">
        </div>

        <div class="mb-3">
            <label class="form-label">Todo Description</label>

            <input type="text"
                   class="form-control"
                   name="desc"
                   value="{{todo.desc}}">
        </div>

        <button type="submit" class="btn btn-dark">
            Update
        </button>

    </form>

</div>

{% endblock %}
